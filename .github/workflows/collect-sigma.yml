name: Collect SIGMA Rules

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-sigma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-sigma:
    runs-on: ubuntu-latest
    env:
      SIGMAHQ_COMMIT: "53423dac8742ef6a44fb73f23f049e84594a66ce"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned SigmaHQ
        run: |
          git init "$RUNNER_TEMP/sigma"
          git -C "$RUNNER_TEMP/sigma" remote add origin https://github.com/SigmaHQ/sigma.git
          git -C "$RUNNER_TEMP/sigma" fetch --depth 1 origin "$SIGMAHQ_COMMIT"
          git -C "$RUNNER_TEMP/sigma" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sigma" rev-parse HEAD)" = "$SIGMAHQ_COMMIT"

      # Pending-permission sources and unpinned supplemental sources are not alert packs.
      # SigmaHQ rules-threat-hunting contains analyst starting points, not detections.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pyyaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Filter observable SIGMA rules
        run: |
          python threat-intel/processing/sigma_filter.py \
            --input "$RUNNER_TEMP/sigma/rules" \
            --input "$RUNNER_TEMP/sigma/rules-emerging-threats" \
            --output "$RUNNER_TEMP/sigma-filtered" \
            --platforms linux --min-status test \
            --source-commit "$SIGMAHQ_COMMIT"

      - name: Compile and false-positive gate with exact qualified manifest
        run: |
          python threat-intel/tests/sigma_benign_events.py "$RUNNER_TEMP/sigma-benign.json"
          cargo run -p detection --example sigma_gate -- \
            "$RUNNER_TEMP/sigma-filtered" "$RUNNER_TEMP/sigma-benign.json" --filter \
            --manifest threat-intel/sigmahq-qualified-53423dac.txt \
            --report "$RUNNER_TEMP/sigma-qualification.json"
          cp "$RUNNER_TEMP/sigma-qualification.json" "$RUNNER_TEMP/sigma-filtered/sigma-qualification.json"
          python threat-intel/processing/sigma_provenance.py \
            "$RUNNER_TEMP/sigma-filtered" "$SIGMAHQ_COMMIT"

      - name: Upload qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sigma-qualification
          path: ${{ runner.temp }}/sigma-qualification.json
          retention-days: 7

      - name: Upload filtered rules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigma-filtered
          path: ${{ runner.temp }}/sigma-filtered/
          retention-days: 7
