name: Collect YARA Rules

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-yara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect-yara:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Enforce real-YARA toolchain
        run: python3 scripts/check_yara_toolchain.py
      - name: Reproduce only the reviewed original-source BSD rule set
        run: |
          python3 threat-intel/processing/yara_curate.py --output "$RUNNER_TEMP/yara-collected"
      - name: Compile and recall-check every rule with the shipped real engine
        run: |
          cargo run --release -p detection --example yara_gate -- \
            --rules "$RUNNER_TEMP/yara-collected" --manifest threat-intel/yara-v1.json \
            --metrics "$RUNNER_TEMP/yara-qualification.json"
      - name: Upload collected rules as artifact
        uses: actions/upload-artifact@v4
        with:
          name: yara-collected
          path: ${{ runner.temp }}/yara-collected/
          retention-days: 7
      - name: Upload qualification log
        uses: actions/upload-artifact@v4
        with:
          name: yara-collection-qualification
          path: ${{ runner.temp }}/yara-qualification.json
          retention-days: 7
