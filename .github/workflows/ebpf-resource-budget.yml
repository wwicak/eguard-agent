name: ebpf-resource-budget

on:
  push:
  pull_request:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      # This benchmark runs natively on the Ubuntu runner. The repository
      # default linker targets an older glibc with Zig, which is incompatible
      # with Ubuntu 24.04's libelf (__isoc23_* symbols).
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libelf-dev zlib1g-dev

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Run eBPF resource budget harness
        run: ./scripts/run_ebpf_resource_budget_ci.sh

      - name: Upload eBPF budget artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ebpf-resource-budget
          path: artifacts/ebpf-resource-budget
