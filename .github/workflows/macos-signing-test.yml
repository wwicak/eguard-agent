name: macOS Signing Test

# Throwaway pipeline to prove the Developer ID sign + notarize path is green.
# Builds ONLY the macOS package (no linux/windows, no GitHub Release publish).
# Auto-runs on pushes to the ci/macos-signing branch; also manually dispatchable.
on:
  push:
    branches:
      - ci/macos-signing
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the test pkg'
        required: false
        default: '0.0.0-sigtest'

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
      MACOS_DEVID_APP_P12_BASE64: ${{ secrets.MACOS_DEVID_APP_P12_BASE64 }}
      MACOS_DEVID_INSTALLER_P12_BASE64: ${{ secrets.MACOS_DEVID_INSTALLER_P12_BASE64 }}
      MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      # Developer ID provisioning profile carrying the ES entitlement grant.
      MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: semver
        run: echo "version=${{ github.event.inputs.version || '0.0.0-sigtest' }}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build ARM64
        env:
          EGUARD_AGENT_VERSION: ${{ steps.semver.outputs.version }}
        run: cargo build --release --target aarch64-apple-darwin -p agent-core

      - name: Build x86_64
        env:
          EGUARD_AGENT_VERSION: ${{ steps.semver.outputs.version }}
        run: cargo build --release --target x86_64-apple-darwin -p agent-core

      - name: Create universal binary
        run: |
          lipo -create \
            target/aarch64-apple-darwin/release/agent-core \
            target/x86_64-apple-darwin/release/agent-core \
            -output eguard-agent
          file eguard-agent

      - name: Import signing certificates
        if: env.MACOS_DEVID_APP_P12_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/eguard-signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          echo "$MACOS_DEVID_APP_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid_app.p12"
          echo "$MACOS_DEVID_INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/devid_inst.p12"
          security import "$RUNNER_TEMP/devid_app.p12"  -k "$KEYCHAIN" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security import "$RUNNER_TEMP/devid_inst.p12" -k "$KEYCHAIN" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/devid_app.p12" "$RUNNER_TEMP/devid_inst.p12"
          echo "Imported code-signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<HASH>/g'

      - name: Prepare notary key
        id: notary
        if: env.MACOS_NOTARY_KEY_P8_BASE64 != ''
        run: |
          echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "path=$RUNNER_TEMP/notary.p8" >> "$GITHUB_OUTPUT"

      - name: Prepare ES provisioning profile
        id: profile
        if: env.MACOS_PROVISION_PROFILE_BASE64 != ''
        run: |
          echo "$MACOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/eGuard_ESF_ID.provisionprofile"
          # sanity: decode CMS and confirm the ES entitlement is present
          security cms -D -i "$RUNNER_TEMP/eGuard_ESF_ID.provisionprofile" | \
            grep -q 'com.apple.developer.endpoint-security.client' \
            || { echo 'profile missing ES entitlement'; exit 1; }
          echo "path=$RUNNER_TEMP/eGuard_ESF_ID.provisionprofile" >> "$GITHUB_OUTPUT"

      - name: Build, sign & notarize .pkg
        run: ./installer/macos/build-pkg.sh
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          BUILD_DMG: '0'
          NOTARY_KEY_P8: ${{ steps.notary.outputs.path }}
          SIGN_ES_ENTITLEMENT: ${{ steps.profile.outputs.path != '' && '1' || '0' }}
          PROVISION_PROFILE: ${{ steps.profile.outputs.path }}

      - name: Verify signature, notarization & Gatekeeper
        run: |
          set -x
          pkgutil --check-signature artifacts/macos/eguard-agent-*.pkg
          spctl -a -vvv --type install artifacts/macos/eguard-agent-*.pkg
          xcrun stapler validate artifacts/macos/eguard-agent-*.pkg
          rm -f "$RUNNER_TEMP/notary.p8" || true

      - name: Upload test pkg
        uses: actions/upload-artifact@v4
        with:
          name: macos-signing-test-pkg
          path: artifacts/macos/eguard-agent-*.pkg
