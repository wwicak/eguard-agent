name: Release NAC Agent
on:
  push:
    tags: ['nac-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version without nac-v prefix
        required: true
permissions:
  contents: read
# Monorepo: the NAC Agent lives in nac-agent/ (Go, its own go.mod). Tags nac-v* never match
# the EDR release pattern v*, and EDR tags never match nac-v*.
defaults:
  run:
    working-directory: nac-agent
concurrency:
  group: release-nac-agent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nac-agent/go.mod
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION=${INPUT_VERSION:-${GITHUB_REF_NAME#nac-v}}
          [[ "$VERSION" =~ ^[0-9][A-Za-z0-9.+-]*$ ]] || exit 2
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: go test -race -count=1 ./...
      - run: for os in linux darwin windows; do GOOS=$os go vet ./...; done
  linux:
    needs: test
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      NFPM_DEB_PASSPHRASE: ${{ secrets.NFPM_DEB_PASSPHRASE }}
      NFPM_RPM_PASSPHRASE: ${{ secrets.NFPM_DEB_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nac-agent/go.mod
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
      - name: Prepare optional signing key
        if: env.GPG_PRIVATE_KEY != ''
        run: |
          umask 077
          printf '%s' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/signing.asc"
          echo "GPG_KEY_FILE=$RUNNER_TEMP/signing.asc" >> "$GITHUB_ENV"
      - env:
          VERSION: ${{ needs.test.outputs.version }}
        run: scripts/build-unix-packages.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            nac-agent/dist/unix/*.deb
            nac-agent/dist/unix/*.rpm
            nac-agent/dist/unix/eguard-nac-linux-*
      - if: always()
        run: rm -f "$RUNNER_TEMP/signing.asc"
  macos:
    needs: test
    runs-on: macos-latest
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_INSTALLER: ${{ secrets.MACOS_DEVELOPER_ID_INSTALLER }}
      MACOS_DEVID_APP_P12_BASE64: ${{ secrets.MACOS_DEVID_APP_P12_BASE64 }}
      MACOS_DEVID_INSTALLER_P12_BASE64: ${{ secrets.MACOS_DEVID_INSTALLER_P12_BASE64 }}
      MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
      MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nac-agent/go.mod
      - name: Build universal binary (CI only)
        run: |
          mkdir -p dist/unix
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -o "dist/unix/eguard-nac-darwin-$arch" ./cmd/nac-service
          done
          lipo -create dist/unix/eguard-nac-darwin-amd64 dist/unix/eguard-nac-darwin-arm64 -output dist/unix/eguard-nac-darwin-universal
      - name: Import optional identities
        if: env.MACOS_DEVID_APP_P12_BASE64 != '' || env.MACOS_DEVID_INSTALLER_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/eguard-signing.keychain-db"
          KPW=$(openssl rand -base64 24)
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          for kind in APP INSTALLER; do
            var="MACOS_DEVID_${kind}_P12_BASE64"
            if [[ -n "${!var}" ]]; then
              printf '%s' "${!var}" | base64 --decode > "$RUNNER_TEMP/identity.p12"
              security import "$RUNNER_TEMP/identity.p12" -k "$KEYCHAIN" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
            fi
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/identity.p12"
      - name: Prepare optional notary key
        if: env.MACOS_NOTARY_KEY_P8_BASE64 != ''
        run: |
          umask 077
          printf '%s' "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_P8=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - name: Build pkg
        env:
          VERSION: ${{ needs.test.outputs.version }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: installer/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: nac-agent/dist/unix/*.pkg
      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/identity.p12"
          if [[ -f "$RUNNER_TEMP/eguard-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/eguard-signing.keychain-db"; fi
  windows-binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nac-agent/go.mod
      - env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          mkdir -p dist/windows
          go build -trimpath -o dist/windows/nac-service.exe ./cmd/nac-service
          go build -trimpath -o dist/windows/nac-setup.exe ./cmd/nac-setup
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: nac-agent/dist/windows/*.exe
  release:
    needs: [test, linux, macos, windows-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: nac-agent/go.mod
      - uses: actions/download-artifact@v4
        with:
          path: nac-agent/dist/release
          merge-multiple: true
      - name: Manifest, checksums and SBOM
        run: |
          python3 scripts/unix-release-manifest.py "$VERSION" dist/release
          python3 scripts/gen-sbom.py go "$VERSION" dist/release/eguard-nac-agent.cdx.json dist/release/eguard-nac-linux-* dist/release/*.exe
          (cd dist/release; sha256sum -- * > ../SHA256SUMS; mv ../SHA256SUMS .)
      - name: Publish
        run: gh release create "nac-v$VERSION" dist/release/* --title "eGuard NAC Agent $VERSION" --notes "eGuard NAC Agent $VERSION (posture/inventory only). Packages are fetched by eGuard servers via the NAC agent sync (manifest eguard-nac-agent-release.json)." --latest=false
