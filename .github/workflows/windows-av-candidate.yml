name: Windows AV candidate (15.0)
on:
  push:
    branches: ['feat/v15.0-av-presence']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.14.1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build ASM
        shell: bash
        run: zig build asm-artifacts
      - name: Check and test Windows inventory
        shell: bash
        run: |
          cargo check --target x86_64-pc-windows-msvc -p platform-windows
          cargo test -p platform-windows
      - name: Build candidate binary
        shell: bash
        env:
          EGUARD_AGENT_VERSION: '15.0.19'
        run: cargo build --release --target x86_64-pc-windows-msvc -p agent-core
      - name: Package MSI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/windows | Out-Null
          wix build installer/windows/eguard-agent.wxs -d AgentExePath=target/x86_64-pc-windows-msvc/release/agent-core.exe -d AgentVersion=15.0.19 -o artifacts/windows/eguard-agent-15.0.19-av-candidate-x64.msi
          Copy-Item target/x86_64-pc-windows-msvc/release/agent-core.exe artifacts/windows/eguard-agent-av-candidate.exe
          Copy-Item installer/windows/install.ps1 artifacts/windows/install.ps1
          Get-ChildItem artifacts/windows -File | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize | Out-File artifacts/windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-15.0-av-candidate
          path: artifacts/windows/
