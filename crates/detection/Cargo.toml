[package]
name = "detection"
rust-version = "1.95"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["yara-x"]
yara-x = ["dep:yara-x"]
# Compatibility alias for existing real-backend test invocations.
yara-rust = ["yara-x"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
regex.workspace = true
rusqlite.workspace = true
aho-corasick.workspace = true
sha2.workspace = true
libc.workspace = true
tracing.workspace = true
yara-x = { version = "=1.23.0", optional = true, default-features = false, features = ["pe-module"] }

[dev-dependencies]
proptest = "1.6"
tempfile = "3"
