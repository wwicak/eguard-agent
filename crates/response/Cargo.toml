[package]
name = "response"
rust-version = "1.95"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["yara-x"]
yara-x = ["detection/yara-x"]
test-quarantine-dir = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
detection = { path = "../detection", default-features = false }
regex = "1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true
