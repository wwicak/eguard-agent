# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: sigma_credential_access
id: sigma_credential_access
level: high
logsource:
  product: linux
detection:
  sequence:
    - event_class: file_open
      process_any_of: [cat, cp, dd, head, tail, less, more, strings, xxd, od, base64, tar, zip, gzip, python, python2, python3, perl, ruby, php, nc, ncat, socat, curl, wget, grep, awk, sed, vim, vi, nano, john, unshadow, hashcat, scp, rsync]
      process_starts_with: [python]
      file_path_any_of: [/etc/shadow, /etc/gshadow, /etc/master.passwd, /etc/security/opasswd]
      within_secs: 10
