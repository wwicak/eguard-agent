# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: sigma_credential_access_ssh_private_key
id: sigma_credential_access_ssh_private_key
level: medium
detection:
  sequence:
    - event_class: file_open
      process_any_of: [cat, cp, dd, base64, xxd, tar, zip, python, python3, perl, nc, ncat, socat, curl, wget, scp]
      process_starts_with: [python]
      file_path_contains: [/.ssh/id_rsa, /.ssh/id_dsa, /.ssh/id_ecdsa, /.ssh/id_ed25519]
      file_path_not_contains: [.pub]
      within_secs: 10
