# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: linux_data_staging_archive
id: linux_data_staging_archive
level: medium
logsource:
  product: linux
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [tar, zip, 7z, 7za, rar, gzip, bzip2, xz, zstd]
      command_line_contains: [/.ssh, /etc/shadow, /etc/gshadow, /.aws/credentials, /.gnupg, /.kube/config, /etc/ssl/private, /.bash_history, /.mozilla/firefox, /.config/google-chrome, /.password-store, /.docker/config.json]
      within_secs: 30
