# Retained until the ACORE merge target proves the same attack/quiet cases.
title: linux_download_exec
id: linux_download_exec
level: high
status: "experimental"
tags: ["attack.t1105","attack.t1059"]
mitre_techniques: ["T1105","T1059"]
logsource:
  product: linux
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [bash, sh, dash, zsh, ksh]
      command_line_all_groups:
        - ['curl ', 'wget ']
        - ['http://', 'https://']
        - ['|bash', '| bash', '|sh', '| sh']
      within_secs: 30
