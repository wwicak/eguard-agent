# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: linux_reverse_shell_devtcp
id: linux_reverse_shell_devtcp
level: high
status: "experimental"
tags: ["attack.t1059","attack.t1071"]
mitre_techniques: ["T1059","T1071"]
logsource:
  product: linux
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [bash, sh, dash, zsh, ksh]
      command_line_all_groups:
        - ["/dev/tcp/", "/dev/udp/"]
        - [">&", "0>&1", "0<&"]
      within_secs: 30
