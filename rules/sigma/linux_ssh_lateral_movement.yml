# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: linux_ssh_lateral_movement
id: linux_ssh_lateral_movement
level: medium
logsource:
  product: linux
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [ssh, scp, sftp]
      command_line_contains: ["-i /tmp/", "-i /dev/shm/", "-i /var/tmp/", "-i/tmp/", "-r 0.0.0.0:", "-r *:", "userknownhostsfile=/dev/null"]
      within_secs: 30
