# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_certutil_download
id: windows_certutil_download
level: high
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [certutil.exe]
      command_line_all_groups:
        - ["urlcache", "verifyctl"]
        - ["http://", "https://"]
      within_secs: 30
