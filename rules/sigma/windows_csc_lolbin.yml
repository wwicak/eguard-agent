# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_csc_lolbin
id: windows_csc_lolbin
level: medium
status: "experimental"
tags: ["attack.t1127"]
mitre_techniques: ["T1127"]
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [csc.exe]
      command_line_contains: ["/out:c:\\users\\public\\", "/out:c:\\programdata\\", "/out:c:\\windows\\temp\\", "/out:%temp%", "/out:%public%"]
      within_secs: 30
