# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_defender_disable
id: windows_defender_disable
level: high
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [powershell.exe, pwsh.exe, powershell_ise.exe]
      command_line_contains: ["-disablerealtimemonitoring $true", "-disablerealtimemonitoring 1", "-disablerealtimemonitoring:$true", "-disablebehaviormonitoring $true", "-disableioavprotection $true", "-disablescriptscanning $true", "-drtm $true", "-drtm 1", "-disableblockatfirstseen $true"]
      within_secs: 30
