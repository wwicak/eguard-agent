# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_ifeo_debugger_persistence
id: windows_ifeo_debugger_persistence
level: high
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [reg.exe, powershell.exe, pwsh.exe]
      command_line_all_groups:
        - [" add ", "new-itemproperty", "set-itemproperty"]
        - ["image file execution options\\"]
        - ["debugger", "globalflag"]
      within_secs: 30
