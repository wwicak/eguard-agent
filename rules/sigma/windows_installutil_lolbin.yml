# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_installutil_lolbin
id: windows_installutil_lolbin
level: medium
status: "experimental"
tags: ["attack.t1218"]
mitre_techniques: ["T1218"]
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [installutil.exe]
      command_line_all_groups:
        - ["/u ", "-u "]
        - ["/logtoconsole=false", "/logfile="]
        - ["\\users\\public\\", "\\appdata\\local\\temp\\", "\\programdata\\", "\\windows\\temp\\", "\\downloads\\"]
      within_secs: 30
