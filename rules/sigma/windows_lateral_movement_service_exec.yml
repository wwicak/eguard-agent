# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_remote_service_exec_child
id: windows_remote_service_exec_child
level: medium
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      parent_any_of: [psexesvc.exe, remcomsvc.exe, csexecsvc.exe, paexec.exe]
      within_secs: 30
