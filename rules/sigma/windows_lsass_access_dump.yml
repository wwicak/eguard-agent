# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_lsass_access_dump
id: windows_lsass_access_dump
level: high
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [rundll32.exe, procdump.exe, procdump64.exe]
      command_line_contains: ["comsvcs.dll, minidump", "comsvcs.dll,minidump", "comsvcs.dll minidump", "comsvcs.dll, #24", "comsvcs.dll,#24", "comsvcs, minidump", "comsvcs,minidump", "-ma lsass", "/ma lsass"]
      within_secs: 30
