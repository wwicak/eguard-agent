# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_mshta_lolbin_download
id: windows_mshta_lolbin_download
level: high
status: "experimental"
tags: ["attack.t1218","attack.t1105"]
mitre_techniques: ["T1218","T1105"]
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [mshta.exe]
      command_line_contains: ["http://", "https://", "javascript:", "vbscript:", "\\\\"]
      within_secs: 30
