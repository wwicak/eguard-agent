# Retained until the ACORE process-command-line merge target passes the same cases.
title: windows_powershell_download_cradle
id: windows_powershell_download_cradle
level: medium
status: "experimental"
tags: ["attack.t1059","attack.t1027","attack.t1562"]
mitre_techniques: ["T1059","T1027","T1562"]
logsource:
  product: windows
  category: process_creation
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [powershell.exe, powershell_ise.exe, pwsh.exe]
      command_line_all_groups:
        - ['downloadstring(', 'downloadfile(', 'invoke-webrequest ', 'iwr ', 'invoke-restmethod ', 'irm ']
        - ['iex(', 'iex (', '| iex', '|iex', 'iex ', 'invoke-expression ']
      within_secs: 30
