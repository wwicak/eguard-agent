# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_registry_runkey_persistence
id: windows_registry_runkey_persistence
level: medium
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [reg.exe, powershell.exe, pwsh.exe]
      command_line_all_groups:
        - [" add ", "new-itemproperty", "set-itemproperty"]
        - ["\\currentversion\\run", "\\currentversion\\policies\\explorer\\run", "\\winlogon"]
      within_secs: 30
