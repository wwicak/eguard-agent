# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_eguard_tamper
id: windows_eguard_tamper
level: high
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [taskkill.exe, powershell.exe, pwsh.exe, sc.exe, net.exe, net1.exe, wmic.exe]
      command_line_contains: ["/im eguard", "stop-process -name eguard", "stop-service eguard", "sc stop eguard", "sc.exe stop eguard", "sc delete eguard", "sc.exe delete eguard", "sc config eguard", "sc.exe config eguard", "net stop eguard", "set-service eguard", "where name='eguard"]
      within_secs: 30
