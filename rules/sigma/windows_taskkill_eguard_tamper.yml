# eGuard-authored endpoint rule; GPL-2.0-or-later.
# RAFIX shared: the engine also enforces package/updater ancestry exclusions.
title: windows_taskkill_eguard_tamper
id: windows_taskkill_eguard_tamper
level: medium
status: experimental
tags: ["attack.t1562.001"]
mitre_techniques: ["T1562.001"]
logsource:
  product: windows
  category: process_creation
detection:
  kill:
    Image|endswith: '\taskkill.exe'
    CommandLine|re: '(?i)(?:^|\s)/im\s+"?eguard-agent\.exe"?(?:\s|$)'
  service:
    Image|endswith: '\sc.exe'
    CommandLine|re: '(?i)(?:^|\s)sc(?:\.exe)?\s+(?:stop|config|delete)\s+"?eguard-agent"?(?:\s|$)'
  condition: kill or service
