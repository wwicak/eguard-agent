# eGuard-authored endpoint rule; GPL-2.0-or-later.
title: windows_wmi_event_subscription_persistence
id: windows_wmi_event_subscription_persistence
level: high
status: "experimental"
tags: ["attack.t1546","attack.t1047"]
mitre_techniques: ["T1546","T1047"]
logsource:
  product: windows
detection:
  sequence:
    - event_class: process_exec
      process_any_of: [powershell.exe, pwsh.exe, wmic.exe]
      command_line_all_groups:
        - [" create ", "set-wmiinstance", "new-ciminstance", ".put(", "register-wmievent"]
        - ["__eventfilter", "commandlineeventconsumer", "activescripteventconsumer", "__filtertoconsumerbinding"]
      within_secs: 30
